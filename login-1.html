<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn Here</title>
    <link rel="stylesheet" href="stayle/app1.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <div class="shape shape--one"></div>
        <div class="shape shape--two"></div>
        <div class="moraba moraba--one"></div>
        <div class="moraba moraba--two"></div>
        <form action="#" class="form">
            <h2 class="form__title">Login Here</h2>
            <div class="form__input-wrapper">
                <label class="form__label" for="username">username</label>
                <input type="text" class="form__input" id="username" placeholder="Email or Phone" required>
            </div>
            <div>
                <label class="form__label" for="password">password</label>
                <input type="password" class="form__input" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="form__submit-btn">Log In</button>
        </form>
    </div>
</body>
</html>
